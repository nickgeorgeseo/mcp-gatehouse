[build-system]
# Pinned: an unpinned backend silently changed the emitted
# Metadata-Version between 0.1.0 (2.4) and 0.2.0 (2.5) with no change
# here, which older twine then rejected. Builds should be reproducible.
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-gatehouse"
version = "0.5.0"
description = "Permission tiers, approval gates, and audit logging for MCP servers — the server is the gatekeeper."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nick George", email = "nick@nickgeorgeai.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "security",
    "audit-log",
    "permissions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = ["mcp>=2,<3"]

[project.scripts]
mcp-gatehouse-demo = "mcp_gatehouse.demo:main"
# Alias so `uvx mcp-gatehouse` / `pipx run mcp-gatehouse` resolve without --from.
mcp-gatehouse = "mcp_gatehouse.demo:main"

[project.urls]
Homepage = "https://nickgeorgeai.com/open-source/mcp-gatehouse"
Repository = "https://github.com/nickgeorgeseo/mcp-gatehouse"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    "build",
    # <7 monkeypatches packaging to cap Metadata-Version at 2.4, which
    # rejects the 2.5 metadata hatchling emits.
    "twine>=7",
    # The package ships py.typed; CI holds its annotations to that.
    "mypy>=2,<3",
    "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gatehouse"]

[tool.hatch.build.targets.sdist]
# The README's demo GIF (300 KB, linked by URL) and CI config aren't
# source; tests, examples and server.json stay.
exclude = ["/docs", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, import order, and modern syntax for 3.10+.
select = ["E", "F", "W", "B", "I", "UP"]

[tool.mypy]
# The floor of requires-python, so 3.11+-only typing fails here first.
python_version = "3.10"
files = ["src/mcp_gatehouse", "examples/orders_server.py"]
