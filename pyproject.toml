[build-system]
# Pinned: an unpinned backend silently changed the emitted
# Metadata-Version between 0.1.0 (2.4) and 0.2.0 (2.5) with no change
# here, which older twine then rejected. Builds should be reproducible.
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-gatehouse"
version = "0.6.0"
description = "Authorization as a runtime invariant for MCP servers: caller, policy and a decision on the record, checked in the server before every tool runs. Tiers, approval gates and an audit log around it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Nick George", email = "nick@nickgeorgeai.com" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "security",
    "audit-log",
    "permissions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = ["mcp>=2.3,<3", "opentelemetry-api>=1.28"]

[project.scripts]
mcp-gatehouse-demo = "mcp_gatehouse.demo:main"
# Alias so `uvx mcp-gatehouse` / `pipx run mcp-gatehouse` resolve without --from.
mcp-gatehouse = "mcp_gatehouse.demo:main"

[project.urls]
Homepage = "https://nickgeorgeai.com/open-source/mcp-gatehouse"
Repository = "https://github.com/nickgeorgeseo/mcp-gatehouse"
Changelog = "https://github.com/nickgeorgeseo/mcp-gatehouse/blob/main/CHANGELOG.md"
Issues = "https://github.com/nickgeorgeseo/mcp-gatehouse/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "anyio>=4",
    # Imported by the tests' HTTP fixtures (tests/_support.py).
    "uvicorn",
    "httpx2",
    # tests/conftest.py checks every audit line against docs/audit-line.schema.json.
    "jsonschema>=4",
    "build",
    # <7 monkeypatches packaging to cap Metadata-Version at 2.4, which
    # rejects the 2.5 metadata hatchling emits.
    "twine>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gatehouse"]

[tool.hatch.build.targets.sdist]
# The recordings are for GitHub, and the README links them by absolute
# URL; in the sdist they were most of its size. Their .tape sources stay.
# release-tests/ is the release campaign's record, not part of the package;
# hatch reads only the root .gitignore, so its own .gitignore doesn't keep
# it out.
exclude = ["docs/*.mp4", "docs/*.gif", "release-tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
